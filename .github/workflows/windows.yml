name: Windows CI

on:
  push:
    branches: [main, slice-1-browser-alpha]
  pull_request:
    branches: [main]

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax errors in $($_.Name): $($errors -join '; ')"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build sandboxed Windows bundle
        run: cargo run --release --bin clearlane-bundle
      - name: Upload browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: clearlane-windows-alpha
          path: target/bundle
          if-no-files-found: error
