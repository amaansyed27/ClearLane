name: Windows CI

on:
  push:
    branches: [main, slice-1-browser-alpha]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply rustfmt on implementation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/slice-1-browser-alpha'
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --quiet
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Apply rustfmt"
            git push origin HEAD:slice-1-browser-alpha
          }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build sandboxed Windows bundle
        run: cargo run --release --bin clearlane-bundle
      - name: Upload browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: clearlane-windows-alpha
          path: target/bundle
          if-no-files-found: error
